<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="76x76" th:href="@{/admin/img/apple-icon.png}">
  <link rel="icon" type="image/png" th:href="@{/admin/img/favicon.png}">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <title>
    Funi Dashboard - Category
  </title>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
  <!-- Fonts and icons -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet" />
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet" />

  <!-- CSS Files -->
  <link th:href="@{/admin/css/bootstrap.min.css}" rel="stylesheet" />
  <link th:href="@{/admin/css/paper-dashboard.css?v=2.0.1}" rel="stylesheet" />
  <link th:href="@{/admin/demo/demo.css}" rel="stylesheet" />
</head>

<body>
<div class="wrapper ">
  <div class="sidebar" data-color="white" data-active-color="danger">
    <div class="logo">
      <a href="https://www.creative-tim.com" class="simple-text logo-mini"></a>
      <a href="https://www.creative-tim.com" class="simple-text logo-normal">Funi Dashboard</a>
    </div>
    <div class="sidebar-wrapper">
      <ul class="nav">
        <li>
          <a th:href="@{/admin/dashboard}">
            <i class="nc-icon nc-bank"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li>
          <a th:href="@{/admin/product}">
            <i class="nc-icon nc-diamond"></i>
            <p>Product</p>
          </a>
        </li>
        <li class="active">
          <a th:href="@{/admin/category}">
            <i class="nc-icon nc-pin-3"></i>
            <p>Category</p>
          </a>
        </li>
        <li>
          <a th:href="@{/admin/user}">
            <i class="nc-icon nc-single-02"></i>
            <p>User</p>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="main-panel">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-absolute fixed-top navbar-transparent">
      <div class="container-fluid">
        <!-- Navbar content -->
      </div>
    </nav>
    <!-- End Navbar -->

    <div class="content">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#createCategoryModal">
                <i class="fa fa-plus"></i> Tạo danh mục mới
              </button>
            </div>

            <div class="card-body">
              <div class="table-responsive">
                <table class="table">
                  <thead class="text-primary">
                  <tr>
                    <th>Tên danh mục</th>
                    <th>Mô tả</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th class="text-right">Hành động</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="category : ${categories}">
                    <td th:text="${category.name}">Danh mục A</td>
                    <td th:text="${category.description}">Mô tả danh mục</td>
                    <td th:text="${category.status}">Hiển thị</td>
                    <td th:text="${#dates.format(category.createdDate, 'yyyy-MM-dd')}">2025-04-27</td>
                    <td class="text-right">
                      <a th:href="@{'/admin/category/edit/' + ${category.id}}" title="Sửa">
                        <i class="fa fa-pencil text-warning mr-2"></i>
                      </a>
                      <a th:href="@{'/admin/category/delete/' + ${category.id}}" title="Xóa">
                        <i class="fa fa-trash text-danger"></i>
                      </a>
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Modal tạo danh mục mới -->
            <div class="modal fade" id="createCategoryModal" tabindex="-1" role="dialog"
                 aria-labelledby="createCategoryModalLabel" aria-hidden="true">
              <div class="modal-dialog" role="document">
                <form th:action="@{/admin/category/save}" method="post" class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="createCategoryModalLabel">Tạo danh mục mới</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Đóng">
                      <span aria-hidden="true">&times;</span>
                    </button>
                  </div>
                  <div class="modal-body">
                    <div class="form-group">
                      <label for="categoryName">Tên danh mục</label>
                      <input type="text" class="form-control" id="categoryName" name="name" placeholder="Nhập tên danh mục" required>
                    </div>
                    <div class="form-group">
                      <label for="categoryDescription">Mô tả</label>
                      <textarea class="form-control" id="categoryDescription" name="description" placeholder="Nhập mô tả"></textarea>
                    </div>
                    <div class="form-group">
                      <label for="categoryStatus">Trạng thái</label>
                      <select class="form-control" id="categoryStatus" name="status" required>
                        <option value="DISPLAY">Hiển thị</option>
                        <option value="HIDDEN">Ẩn</option>
                      </select>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                  </div>
                </form>
              </div>
            </div>
            <!-- End Modal -->

          </div>
        </div>
      </div>
    </div>

    <footer class="footer footer-black footer-white">
      <div class="container-fluid">
        <div class="row">
          <nav class="footer-nav">
            <ul>
              <li><a href="https://www.creative-tim.com" target="_blank">Creative Tim</a></li>
              <li><a href="https://www.creative-tim.com/blog" target="_blank">Blog</a></li>
              <li><a href="https://www.creative-tim.com/license" target="_blank">Licenses</a></li>
            </ul>
          </nav>
          <div class="credits ml-auto">
            <span class="copyright">
              © <script>document.write(new Date().getFullYear())</script>, made with <i class="fa fa-heart heart"></i> by Creative Tim
            </span>
          </div>
        </div>
      </div>
    </footer>
  </div>
</div>

<!-- Core JS Files -->
<script th:src="@{/admin/js/core/jquery.min.js}"></script>
<script th:src="@{/admin/js/core/popper.min.js}"></script>
<script th:src="@{/admin/js/core/bootstrap.min.js}"></script>
<script th:src="@{/admin/js/plugins/perfect-scrollbar.jquery.min.js}"></script>
<script th:src="@{/admin/js/plugins/chartjs.min.js}"></script>
<script th:src="@{/admin/js/plugins/bootstrap-notify.js}"></script>
<script th:src="@{/admin/js/paper-dashboard.min.js?v=2.0.1}"></script>
<script th:src="@{/admin/demo/demo.js}"></script>
</body>

</html>
