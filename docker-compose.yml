version: "3.9"

services:
  app:
    build:
      context: .              # Root where your Spring Boot Dockerfile is
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - db
      - minio
      - ai_caption
      - ai_advise
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/image_captioning
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      AI_CAPTION_URL: http://ai_caption:8000/gen-cap
      AI_ADVISE_FROM_IMAGES_URL: http://ai_advise:5000/images/advise
      AI_ADVISE_FROM_QUERY_URL: http://ai_advise:5000/query/advise
      MINIO_ENDPOINT: https://405d-27-73-113-136.ngrok-free.app
      MINIO_EXTERNAL_ENDPOINT: https://405d-27-73-113-136.ngrok-free.app
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fashion-captioner
    networks:
      - backend
    restart: always

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: image_captioning
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    ports:
      - "3307:3306"

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "https://405d-27-73-113-136.ngrok-free.app"
      MINIO_BROWSER_REDIRECT_URL: "https://405d-27-73-113-136.ngrok-free.app/minio"
    volumes:
      - minio_data:/data
      - ./init-bucket.sh:/docker-entrypoint-initdb.d/init-bucket.sh
    expose:
      - "9000"
      - "9001"
    command: server /data --console-address ":9001"
    networks:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    networks:
      - backend
    restart: always

  ai_caption:
    build:
      context: ./ai_caption
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    networks:
      - backend

  ai_advise:
    build:
      context: ./ai_advise
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    networks:
      - backend

volumes:
  mysql_data:
  minio_data:

networks:
  backend:
    driver: bridge

